[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ga-rag-optimizer"
version = "0.1.0"
description = "Evolutionäre Hyperparameter-Optimierung für RAG-Pipelines"
authors = [{ name = "Marco Karic" }]
requires-python = ">=3.11"
dependencies = [
    # Genetische Algorithmen
    "deap>=1.4.1",
    # RAG-Pipeline
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-huggingface>=0.1.0",
    # Vektordatenbank
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    # Retrieval (BM25 als nicht-dense Baseline)
    "rank-bm25>=0.2.2",
    # Evaluations-Datensatz (HotpotQA via HuggingFace)
    "datasets>=2.18.0",
    # Datenverarbeitung
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    # Visualisierung
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Konfiguration
    "pyyaml>=6.0.1",
    # Utilities
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    # Notebooks
    "jupyter>=1.0.0",
    "nbformat>=5.10.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
